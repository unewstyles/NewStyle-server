<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — VELOX</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0b0f;color:#edeff4;font-family:'Space Grotesk','Segoe UI',sans-serif;padding:24px;box-sizing:border-box}
    .box{max-width:420px;text-align:center}
    .ic{width:52px;height:52px;color:#f2b441;margin:0 auto 26px}
    h1{font-size:26px;margin:0 0 12px;text-transform:uppercase;letter-spacing:-.01em}
    p{font-size:14.5px;line-height:1.7;color:#9aa0ae;margin:0 0 28px}
    .dot{color:#f2b441}
    button{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px;border:none;border-radius:12px;background:#f2b441;color:#0b0c10;font:600 14px 'Space Grotesk',sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <h1>Vous êtes hors ligne<span class="dot">.</span></h1>
    <p>Le catalogue VELOX se charge sans connexion, mais il doit avoir été visité au moins une fois en ligne pour être mis en cache. Reconnectez-vous, rouvrez l'application — elle sera ensuite disponible hors ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
